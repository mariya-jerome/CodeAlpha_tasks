<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="calculator">
        <h2> Calculator</h2>

        <input type="text" id="display" value="0" aria-label="Calculator expression" readonly>
        <output id="preview" class="preview" aria-live="polite" aria-label="Live result"></output>

        <div class="buttons">
            <button data-action="clear" class="clear">AC</button>
            <button data-action="delete" class="delete">DEL</button>
            <button data-value="%">%</button>
            <button data-value="/" class="operator">÷</button>

            <button data-value="7">7</button>
            <button data-value="8">8</button>
            <button data-value="9">9</button>
            <button data-value="*" class="operator">×</button>

            <button data-value="4">4</button>
            <button data-value="5">5</button>
            <button data-value="6">6</button>
            <button data-value="-" class="operator">−</button>

            <button data-value="1">1</button>
            <button data-value="2">2</button>
            <button data-value="3">3</button>
            <button data-value="+" class="operator">+</button>

            <button data-action="sign">+/−</button>
            <button data-value="0" class="zero">0</button>
            <button data-action="decimal">.</button>

            <button data-action="clear" class="clear">C</button>
            <button data-action="calculate" class="equals">=</button>
        </div>

        <p>Keyboard supported</p>
    </div>

</body>
</html>
